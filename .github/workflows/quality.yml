name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aml-risk-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check backend/app data/etl/src
      - name: Check Python formatting
        run: python -m ruff format --check backend/app data/etl/src
      - name: Compile Python
        run: python -m compileall -q backend/app data/etl/src
      - name: Run backend tests
        working-directory: aml-risk-platform/backend
        run: python -m unittest discover -s app/tests

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aml-risk-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aml-risk-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
